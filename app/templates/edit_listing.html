{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-md overflow-hidden">
        <div class="bg-gradient-to-r from-yellow-500 to-yellow-600 px-6 py-4">
            <h2 class="text-2xl font-bold text-white flex items-center">
                <i class="fas fa-edit mr-2"></i> Edit Listing
            </h2>
        </div>
        
        <form method="POST" class="p-6 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-carrot mr-1"></i> Produce Type
                    </label>
                    <select name="produce_type" required 
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-500">
                        <option value="tomato" {% if listing.produce.type == 'tomato' %}selected{% endif %}>Tomato</option>
                        <option value="potato" {% if listing.produce.type == 'potato' %}selected{% endif %}>Potato</option>
                        <option value="onion" {% if listing.produce.type == 'onion' %}selected{% endif %}>Onion</option>
                        <option value="carrot" {% if listing.produce.type == 'carrot' %}selected{% endif %}>Carrot</option>
                        <option value="cabbage" {% if listing.produce.type == 'cabbage' %}selected{% endif %}>Cabbage</option>
                        <option value="cauliflower" {% if listing.produce.type == 'cauliflower' %}selected{% endif %}>Cauliflower</option>
                        <option value="brinjal" {% if listing.produce.type == 'brinjal' %}selected{% endif %}>Brinjal</option>
                        <option value="ladyfinger" {% if listing.produce.type == 'ladyfinger' %}selected{% endif %}>Ladyfinger</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-seedling mr-1"></i> Variety
                    </label>
                    <input type="text" name="variety" value="{{ listing.produce.variety }}"
                           class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-500">
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-weight-hanging mr-1"></i> Quantity (kg)
                    </label>
                    <input type="number" step="0.1" name="quantity" required value="{{ listing.quantity }}"
                           class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-500">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-rupee-sign mr-1"></i> Price per kg (₹)
                    </label>
                    <input type="number" step="0.01" name="price_per_kg" required value="{{ listing.price_per_kg }}"
                           class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-500">
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-map-marker-alt mr-1"></i> Market Location
                    </label>
                    <input type="text" name="market_location" required value="{{ listing.market_location }}"
                           class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-500">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-calendar mr-1"></i> Harvest Date
                    </label>
                    <input type="date" name="harvest_date" required value="{{ listing.harvest_date.strftime('%Y-%m-%d') }}"
                           class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-500">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-star mr-1"></i> Quality
                </label>
                <select name="quality" 
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-500">
                    <option value="standard" {% if listing.produce.quality == 'standard' %}selected{% endif %}>Standard</option>
                    <option value="premium" {% if listing.produce.quality == 'premium' %}selected{% endif %}>Premium</option>
                    <option value="economy" {% if listing.produce.quality == 'economy' %}selected{% endif %}>Economy</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-align-left mr-1"></i> Description
                </label>
                <textarea name="description" rows="3" 
                          class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-500">{{ listing.description }}</textarea>
            </div>
            
            <div class="flex justify-end space-x-3 pt-4">
                <a href="/manage-listings" class="px-6 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition">
                    Cancel
                </a>
                <button type="submit" class="px-6 py-2 bg-yellow-600 text-white rounded-lg hover:bg-yellow-700 transition">
                    <i class="fas fa-save mr-1"></i> Update Listing
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
