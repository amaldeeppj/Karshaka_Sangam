{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-md overflow-hidden">
        <div class="bg-gradient-to-r from-green-600 to-green-700 px-6 py-4">
            <h2 class="text-2xl font-bold text-white flex items-center">
                <i class="fas fa-plus-circle mr-2"></i> Add New Listing
            </h2>
        </div>
        
        <form method="POST" class="p-6 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-id-card mr-1"></i> Farmer ID
                    </label>
                    <input type="text" name="farmer_id" required 
                           class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                           placeholder="e.g., FARM001">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-user mr-1"></i> Farmer Name
                    </label>
                    <input type="text" name="farmer_name" required 
                           class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                           placeholder="Full name">
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-carrot mr-1"></i> Produce Type
                    </label>
                    <select name="produce_type" required 
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                        <option value="">Select produce</option>
                        <option value="tomato">Tomato</option>
                        <option value="potato">Potato</option>
                        <option value="onion">Onion</option>
                        <option value="carrot">Carrot</option>
                        <option value="cabbage">Cabbage</option>
                        <option value="cauliflower">Cauliflower</option>
                        <option value="brinjal">Brinjal</option>
                        <option value="ladyfinger">Ladyfinger</option>
                        <option value="spinach">Spinach</option>
                        <option value="capsicum">Capsicum</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-seedling mr-1"></i> Variety
                    </label>
                    <input type="text" name="variety" 
                           class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                           placeholder="e.g., Hybrid, Organic">
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-weight-hanging mr-1"></i> Quantity (kg)
                    </label>
                    <input type="number" step="0.1" name="quantity" required 
                           class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                           placeholder="e.g., 100">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-rupee-sign mr-1"></i> Price per kg (₹)
                    </label>
                    <input type="number" step="0.01" name="price_per_kg" required 
                           class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                           placeholder="e.g., 45.50">
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-map-marker-alt mr-1"></i> Market Location
                    </label>
                    <input type="text" name="market_location" required 
                           class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                           placeholder="e.g., Ernakulam Market">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-calendar mr-1"></i> Harvest Date
                    </label>
                    <input type="date" name="harvest_date" required 
                           class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-star mr-1"></i> Quality
                </label>
                <select name="quality" 
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                    <option value="standard">Standard</option>
                    <option value="premium">Premium</option>
                    <option value="economy">Economy</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-align-left mr-1"></i> Description
                </label>
                <textarea name="description" rows="3" 
                          class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                          placeholder="Additional details about the produce..."></textarea>
            </div>
            
            <div class="flex justify-end space-x-3 pt-4">
                <a href="/" class="px-6 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition">
                    Cancel
                </a>
                <button type="submit" class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
                    <i class="fas fa-save mr-1"></i> Add Listing
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
